name: Fullstendig testsuite

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - '.env*'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - '.env*'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: test-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: Backend-tester
    if: github.actor != 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'ci:run')
    runs-on: [self-hosted, linux, nuc]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Kjør alle backend-tester
        run: ./gradlew test --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-rapport
          path: build/reports/tests/test/
          retention-days: 30
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: always()
        with:
          name: JUnit Tester
          path: build/test-results/test/*.xml
          reporter: java-junit
